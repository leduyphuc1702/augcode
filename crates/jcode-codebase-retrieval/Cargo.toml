[package]
name = "jcode-codebase-retrieval"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = "0.4"
jcode-code-intel = { path = "../jcode-code-intel" }
jcode-codebase-sync = { path = "../jcode-codebase-sync" }
jcode-embedding = { path = "../jcode-embedding", optional = true }
jcode-storage = { path = "../jcode-storage", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[features]
default = []
embeddings = ["dep:jcode-embedding", "dep:jcode-storage"]
